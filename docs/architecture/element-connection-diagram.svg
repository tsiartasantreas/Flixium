<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, sans-serif" font-size="12">
  <rect width="900" height="640" fill="#141414"/>
  <!-- Supabase -->
  <rect x="320" y="20" width="260" height="110" rx="8" fill="#181818" stroke="#E11D48" stroke-width="1.5"/>
  <text x="450" y="45" text-anchor="middle" fill="#FFFFFF" font-weight="bold">SUPABASE CLOUD</text>
  <text x="450" y="65" text-anchor="middle" fill="#B3B3B3">project "Flixium"</text>
  <text x="450" y="85" text-anchor="middle" fill="#B3B3B3">Postgres · Auth · Storage</text>
  <text x="450" y="103" text-anchor="middle" fill="#B3B3B3">Supabase Studio (schema web UI)</text>
  <text x="450" y="120" text-anchor="middle" fill="#B3B3B3">Row-Level Security</text>
  <!-- Flutter App -->
  <rect x="30" y="200" width="260" height="150" rx="8" fill="#181818" stroke="#E11D48" stroke-width="1.5"/>
  <text x="160" y="225" text-anchor="middle" fill="#FFFFFF" font-weight="bold">1. FLUTTER APP</text>
  <text x="160" y="248" text-anchor="middle" fill="#B3B3B3">phone / Android TV / Fire TV</text>
  <text x="160" y="270" text-anchor="middle" fill="#B3B3B3">• Netflix-clone UI</text>
  <text x="160" y="290" text-anchor="middle" fill="#B3B3B3">• media_kit player</text>
  <text x="160" y="310" text-anchor="middle" fill="#B3B3B3">• Drift local DB</text>
  <text x="160" y="330" text-anchor="middle" fill="#B3B3B3">• entitlement (anon/free/pro)</text>
  <!-- Wasmer Edge -->
  <rect x="320" y="200" width="260" height="200" rx="8" fill="#181818" stroke="#E11D48" stroke-width="1.5"/>
  <text x="450" y="225" text-anchor="middle" fill="#FFFFFF" font-weight="bold">4. WASMER EDGE APP</text>
  <text x="450" y="248" text-anchor="middle" fill="#B3B3B3">ADMIN PANEL SPA</text>
  <text x="450" y="266" text-anchor="middle" fill="#B3B3B3">PAYMENT/LICENSING API</text>
  <text x="450" y="288" text-anchor="middle" fill="#B3B3B3">/checkout /webhook</text>
  <text x="450" y="306" text-anchor="middle" fill="#B3B3B3">/verify-device /revoke</text>
  <text x="450" y="324" text-anchor="middle" fill="#B3B3B3">/admin/*</text>
  <text x="450" y="350" text-anchor="middle" fill="#E11D48">/dl/latest → latest APK</text>
  <text x="450" y="380" text-anchor="middle" fill="#B3B3B3">secrets: service-role, Revolut, ...</text>
  <!-- Revolut -->
  <rect x="610" y="200" width="260" height="100" rx="8" fill="#181818" stroke="#E11D48" stroke-width="1.5"/>
  <text x="740" y="225" text-anchor="middle" fill="#FFFFFF" font-weight="bold">REVOLUT MERCHANT API</text>
  <text x="740" y="250" text-anchor="middle" fill="#B3B3B3">• Order ($8.99)</text>
  <text x="740" y="270" text-anchor="middle" fill="#B3B3B3">• hosted checkout (browser)</text>
  <text x="740" y="290" text-anchor="middle" fill="#B3B3B3">• signed webhook → Wasmer</text>
  <!-- Connections -->
  <line x1="160" y1="200" x2="360" y2="130" stroke="#B3B3B3" stroke-width="1.2"/>
  <text x="180" y="175" fill="#B3B3B3">HTTPS + JWT + RLS</text>
  <line x1="450" y1="400" x2="450" y2="430" stroke="#B3B3B3" stroke-width="1.2"/>
  <line x1="580" y1="300" x2="610" y2="250" stroke="#B3B3B3" stroke-width="1.2"/>
  <line x1="290" y1="290" x2="320" y2="290" stroke="#B3B3B3" stroke-width="1.2"/>
  <text x="295" y="282" fill="#B3B3B3">checkout/verify</text>
  <line x1="580" y1="130" x2="520" y2="200" stroke="#B3B3B3" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="540" y="175" fill="#B3B3B3">service-role</text>
  <!-- GitHub -->
  <rect x="320" y="440" width="260" height="80" rx="8" fill="#181818" stroke="#E11D48" stroke-width="1.5"/>
  <text x="450" y="465" text-anchor="middle" fill="#FFFFFF" font-weight="bold">GITHUB RELEASES</text>
  <text x="450" y="488" text-anchor="middle" fill="#B3B3B3">tag → signed APK (arm64 + universal)</text>
  <text x="450" y="506" text-anchor="middle" fill="#B3B3B3">Downloader app → /dl/latest → here</text>
  <line x1="450" y1="400" x2="450" y2="440" stroke="#E11D48" stroke-width="1.2"/>
  <text x="455" y="422" fill="#E11D48">resolves latest</text>
</svg>
