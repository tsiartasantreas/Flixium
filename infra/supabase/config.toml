# Supabase project configuration for iFlixify IPTV.
# This file would normally be generated by `supabase init`. For Phase 0 it is
# hand-authored with the minimum settings required for a valid local workspace.
# Cloud project linking and migration application happen in Task 6 (see docs/INSTALL.md).

project_id = "iflixify"

[api]
enabled = true
# Port to use for the API URL. Local dev only; cloud uses the project URL.
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local Postgres port. Cloud uses the project's pooled connection string.
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# The base URL of your website. Updated to the production URL on deploy.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
