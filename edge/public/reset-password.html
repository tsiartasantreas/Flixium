<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iFlixify - Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #141414; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 400px; width: 90%; padding: 40px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; }
    .logo { text-align: center; font-size: 28px; font-weight: 800; color: #E50914; margin-bottom: 32px; }
    h2 { text-align: center; font-size: 24px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #999; }
    .form-group input { width: 100%; padding: 12px 16px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; }
    .form-group input:focus { outline: none; border-color: #E50914; }
    .btn { width: 100%; padding: 14px; background: #E50914; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #C40812; }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; text-align: center; }
    .message.success { background: #1a2a1a; color: #28a745; }
    .message.error { background: #2a1a1a; color: #dc3545; }
    .back-link { display: block; text-align: center; margin-top: 24px; color: #999; text-decoration: none; font-size: 14px; }
    .back-link:hover { color: #E50914; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">iFlixify</div>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below</p>
    <form id="resetForm" onsubmit="resetPassword(event)">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="Enter new password" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8">
      </div>
      <button type="submit" class="btn" id="submitBtn">Reset Password</button>
    </form>
    <div id="message" class="message" style="display: none;"></div>
    <a href="/" class="back-link">← Back to Home</a>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://zosckkklctvrsjqjmyiv.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvc2Nra2tsY3R2cnNqcWpteWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODA2NDAsImV4cCI6MjEwMTg1NjY0MH0.bVAxexYv9e7Jo8PLRwYVyzLi6L9PFvxE3M8ZIheMmmA";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    function getAccessToken() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    async function resetPassword(event) {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      if (password !== confirmPassword) { messageDiv.textContent = 'Passwords do not match'; messageDiv.className = 'message error'; messageDiv.style.display = 'block'; return; }
      if (password.length < 8) { messageDiv.textContent = 'Password must be at least 8 characters'; messageDiv.className = 'message error'; messageDiv.style.display = 'block'; return; }

      const accessToken = getAccessToken();
      if (!accessToken) { messageDiv.textContent = 'Invalid or expired reset link. Please request a new one from the app.'; messageDiv.className = 'message error'; messageDiv.style.display = 'block'; return; }

      submitBtn.disabled = true;
      try {
        const { error: sessionError } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: '' });
        if (sessionError) throw sessionError;
        const { error } = await supabase.auth.updateUser({ password: password });
        if (error) throw error;
        messageDiv.textContent = 'Password reset successful! You can now sign in with your new password in the iFlixify app.';
        messageDiv.className = 'message success';
        messageDiv.style.display = 'block';
        document.getElementById('resetForm').reset();
      } catch (error) {
        messageDiv.textContent = error.message || 'Failed to reset password. Please try again.';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
      } finally { submitBtn.disabled = false; }
    }
  </script>
</body>
</html>
