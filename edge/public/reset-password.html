<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iFlixify - Reset Password</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #141414; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 400px; width: 90%; padding: 40px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; }
    .logo { text-align: center; font-size: 28px; font-weight: 800; color: #E50914; margin-bottom: 32px; }
    h2 { text-align: center; font-size: 24px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #999; }
    .form-group input { width: 100%; padding: 12px 16px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; }
    .form-group input:focus { outline: none; border-color: #E50914; }
    .btn { width: 100%; padding: 14px; background: #E50914; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #C40812; }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; text-align: center; }
    .message.success { background: #1a2a1a; color: #28a745; }
    .message.error { background: #2a1a1a; color: #dc3545; }
    .message a { color: #E50914; font-weight: 600; }
    .divider { border-top: 1px solid #333; margin: 32px 0; }
    .back-link { display: block; text-align: center; margin-top: 24px; color: #999; text-decoration: none; font-size: 14px; }
    .back-link:hover { color: #E50914; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">iFlixify</div>

    <div id="resetWrap">
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your new password below</p>
      <form id="resetForm" onsubmit="resetPassword(event)">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="Enter new password" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8">
        </div>
        <button type="submit" class="btn" id="submitBtn">Reset Password</button>
      </form>
    </div>

    <div id="requestSection" style="display: none;">
      <div class="divider"></div>
      <h2 style="font-size: 18px;">Request a new reset link</h2>
      <p class="subtitle" style="margin-bottom: 20px;">Enter your account email and we'll send you a fresh reset link.</p>
      <form id="requestForm" onsubmit="requestNewLink(event)">
        <div class="form-group">
          <label for="requestEmail">Email</label>
          <input type="email" id="requestEmail" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn" id="requestBtn">Send Reset Link</button>
      </form>
    </div>

    <div id="message" class="message" style="display: none;"></div>
    <a href="/" class="back-link">← Back to Home</a>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
  <script>
    // NOTE: the CDN bundle declares a global `supabase` (var), so we must NOT
    // redeclare that name here. Our client instance is named `sb`.
    const supabaseUrl = "https://zosckkklctvrsjqjmyiv.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvc2Nra2tsY3R2cnNqcWpteWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODA2NDAsImV4cCI6MjEwMTg1NjY0MH0.bVAxexYv9e7Jo8PLRwYVyzLi6L9PFvxE3M8ZIheMmmA";
    const sb = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    function showMessage(text, type, isHtml) {
      const messageDiv = document.getElementById('message');
      if (isHtml) { messageDiv.innerHTML = text; } else { messageDiv.textContent = text; }
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }

    function showRequestSection() { document.getElementById('requestSection').style.display = 'block'; }
    function hideResetForm() { document.getElementById('resetWrap').style.display = 'none'; }

    function isTokenError(message) {
      return /expired|invalid|token|jwt|401|403|session/i.test(message || '');
    }

    function showExpired() {
      showMessage('This reset link has expired. Please request a new one from the app.', 'error');
      showRequestSection();
    }

    // Returns true when we have a usable Supabase session: either an existing
    // one (restored from storage or auto-detected from the URL hash by the
    // client) or one we can establish manually from the recovery link tokens.
    async function ensureSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) return true;
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        if (!accessToken || !refreshToken) return false;
        const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        return !error;
      } catch (e) { return false; }
    }

    async function resetPassword(event) {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      if (password !== confirmPassword) { showMessage('Passwords do not match', 'error'); return; }
      if (password.length < 8) { showMessage('Password must be at least 8 characters', 'error'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';
      try {
        const hasSession = await ensureSession();
        if (!hasSession) { showExpired(); return; }

        const { error } = await sb.auth.updateUser({ password: password });
        if (error) {
          if (isTokenError(error.message)) { showExpired(); }
          else { showMessage(error.message || 'Failed to reset password. Please try again.', 'error'); }
          return;
        }

        hideResetForm();
        showMessage('Password changed successfully! You can now sign in with your new password in the app. <a href="/profile.html">Sign In</a>', 'success', true);
      } catch (error) {
        const msg = error.message || 'Failed to reset password. Please try again.';
        if (isTokenError(msg)) { showExpired(); } else { showMessage(msg, 'error'); }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    }

    async function requestNewLink(event) {
      event.preventDefault();
      const email = document.getElementById('requestEmail').value.trim();
      const requestBtn = document.getElementById('requestBtn');
      requestBtn.disabled = true;
      try {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password.html' });
        if (error) throw error;
        showMessage('Reset email sent. Check your inbox for your new reset link.', 'success');
      } catch (error) {
        showMessage('Error: ' + (error.message || 'Failed to send reset email.'), 'error');
      } finally { requestBtn.disabled = false; }
    }

    // On load: if there is neither a token in the URL nor an existing session,
    // the reset form cannot work - explain and offer the fallback form.
    (async function init() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const hasTokenInUrl = !!params.get('access_token');
      const { data: { session } } = await sb.auth.getSession();
      if (!hasTokenInUrl && !session) {
        showExpired();
        hideResetForm();
      }
    })();
  </script>
</body>
</html>
