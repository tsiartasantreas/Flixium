<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iFlixify Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #141414; color: #fff; min-height: 100vh; }
    .header { background: #1a1a1a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
    .logo { font-size: 24px; font-weight: 800; color: #E50914; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #1a1a1a; border-radius: 8px; padding: 20px; border: 1px solid #333; }
    .stat-value { font-size: 32px; font-weight: 700; color: #E50914; }
    .stat-label { font-size: 14px; color: #999; margin-top: 4px; }
    .section { margin-bottom: 32px; }
    .section h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #E50914; }
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #222; font-weight: 600; font-size: 14px; }
    td { font-size: 14px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-pro { background: #E50914; color: #fff; }
    .badge-free { background: #333; color: #999; }
    .badge-admin { background: #FFD700; color: #000; }
    .btn { padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #E50914; color: #fff; }
    .btn-primary:hover { background: #C40812; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-danger:hover { background: #c82333; }
    .actions { display: flex; gap: 8px; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-bar input, .search-bar select { padding: 10px 16px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px; }
    .search-bar input { flex: 1; }
    .search-bar input:focus, .search-bar select:focus { outline: none; border-color: #E50914; }
    .loading { text-align: center; padding: 40px; color: #999; }
    .error { color: #dc3545; padding: 16px; background: #2a1a1a; border-radius: 8px; margin-bottom: 16px; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #1a1a1a; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%; border: 1px solid #333; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #999; }
    .form-group input, .form-group select { width: 100%; padding: 10px 16px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: #999; text-decoration: none; margin-bottom: 24px; font-size: 14px; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">iFlixify Admin</div>
    <div>
      <span id="adminEmail" style="color: #999; font-size: 14px;"></span>
      <button onclick="logout()" style="margin-left: 16px; background: none; border: none; color: #E50914; cursor: pointer; font-size: 14px;">Logout</button>
    </div>
  </header>

  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <div id="loginForm" style="max-width: 400px; margin: 80px auto; text-align: center;">
      <h2 style="margin-bottom: 24px;">Admin Login</h2>
      <input type="email" id="loginEmail" placeholder="Email" style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; margin-bottom: 12px; font-size: 14px;">
      <input type="password" id="loginPassword" placeholder="Password" style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px;">
      <button onclick="login()" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 16px;">Sign In</button>
      <div id="loginError" class="error" style="display: none; margin-top: 16px;"></div>
    </div>

    <div id="adminPanel" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalUsers">-</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="proUsers">-</div><div class="stat-label">Pro Users</div></div>
        <div class="stat-card"><div class="stat-value" id="freeUsers">-</div><div class="stat-label">Free Users</div></div>
        <div class="stat-card"><div class="stat-value" id="adminUsers">-</div><div class="stat-label">Admins</div></div>
      </div>

      <div class="section">
        <h2>User Management</h2>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search users by email or name..." oninput="filterUsers()">
          <select id="tierFilter" onchange="filterUsers()">
            <option value="">All Tiers</option>
            <option value="free">Free</option>
            <option value="pro">Pro</option>
          </select>
        </div>
        <table>
          <thead><tr><th>Email</th><th>Name</th><th>Tier</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="usersTable"><tr><td colspan="5" class="loading">Loading users...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">Edit User</h3>
      <input type="hidden" id="editUserId">
      <div class="form-group"><label>Email</label><input type="email" id="editEmail" readonly style="opacity: 0.7;"></div>
      <div class="form-group"><label>Display Name</label><input type="text" id="editName"></div>
      <div class="form-group"><label>Tier</label><select id="editTier"><option value="free">Free</option><option value="pro">Pro</option></select></div>
      <div class="form-group"><label><input type="checkbox" id="editAdmin"> Admin</label></div>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button onclick="closeModal()" class="btn btn-secondary">Cancel</button>
        <button onclick="saveUser()" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://zosckkklctvrsjqjmyiv.supabase.co";
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvc2Nra2tsY3R2cnNqcWpteWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODA2NDAsImV4cCI6MjEwMTg1NjY0MH0.bVAxexYv9e7Jo8PLRwYVyzLi6L9PFvxE3M8ZIheMmmA";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
    let currentUser = null;
    let users = [];

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) { currentUser = session.user; showAdmin(); loadUsers(); }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      if (!email || !password) { errorDiv.textContent = 'Please enter email and password'; errorDiv.style.display = 'block'; return; }
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        showAdmin();
        loadUsers();
        errorDiv.style.display = 'none';
      } catch (error) { errorDiv.textContent = error.message; errorDiv.style.display = 'block'; }
    }

    function showAdmin() {
      document.getElementById('adminEmail').textContent = currentUser.email;
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    }

    async function logout() {
      await supabase.auth.signOut();
      currentUser = null;
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    }

    async function loadUsers() {
      try {
        const { data, error } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        users = data || [];
        updateStats();
        renderUsers(users);
      } catch (error) {
        document.getElementById('usersTable').innerHTML = '<tr><td colspan="5" class="error">Error: ' + error.message + '</td></tr>';
      }
    }

    function updateStats() {
      document.getElementById('totalUsers').textContent = users.length;
      document.getElementById('proUsers').textContent = users.filter(u => u.tier === 'pro').length;
      document.getElementById('freeUsers').textContent = users.filter(u => u.tier === 'free').length;
      document.getElementById('adminUsers').textContent = users.filter(u => u.is_admin).length;
    }

    function renderUsers(usersToRender) {
      const tbody = document.getElementById('usersTable');
      if (usersToRender.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">No users found</td></tr>'; return; }
      tbody.innerHTML = usersToRender.map(user => {
        const tierBadge = user.is_admin ? 'badge-admin' : (user.tier === 'pro' ? 'badge-pro' : 'badge-free');
        const tierLabel = user.is_admin ? 'Admin' : (user.tier === 'pro' ? 'Pro' : 'Free');
        const created = new Date(user.created_at).toLocaleDateString();
        return '<tr><td>' + (user.email || '-') + '</td><td>' + (user.display_name || '-') + '</td><td><span class="badge ' + tierBadge + '">' + tierLabel + '</span></td><td>' + created + '</td><td class="actions"><button onclick="editUser(\'' + user.id + '\')" class="btn btn-secondary">Edit</button><button onclick="deleteUser(\'' + user.id + '\',\'' + (user.email || '') + '\')" class="btn btn-danger">Delete</button></td></tr>';
      }).join('');
    }

    function filterUsers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tier = document.getElementById('tierFilter').value;
      let filtered = users;
      if (search) filtered = filtered.filter(u => (u.email && u.email.toLowerCase().includes(search)) || (u.display_name && u.display_name.toLowerCase().includes(search)));
      if (tier) filtered = filtered.filter(u => tier === 'admin' ? u.is_admin : u.tier === tier && !u.is_admin);
      renderUsers(filtered);
    }

    function editUser(userId) {
      const user = users.find(u => u.id === userId);
      if (!user) return;
      document.getElementById('editUserId').value = user.id;
      document.getElementById('editEmail').value = user.email || '';
      document.getElementById('editName').value = user.display_name || '';
      document.getElementById('editTier').value = user.tier || 'free';
      document.getElementById('editAdmin').checked = user.is_admin || false;
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() { document.getElementById('editModal').classList.remove('active'); }

    async function saveUser() {
      const userId = document.getElementById('editUserId').value;
      const name = document.getElementById('editName').value;
      const tier = document.getElementById('editTier').value;
      const isAdmin = document.getElementById('editAdmin').checked;
      try {
        const { error } = await supabase.from('profiles').update({ display_name: name, tier: tier, is_admin: isAdmin }).eq('id', userId);
        if (error) throw error;
        closeModal();
        loadUsers();
      } catch (error) { alert('Error: ' + error.message); }
    }

    async function deleteUser(userId, email) {
      if (!confirm('Delete user ' + email + '? This cannot be undone.')) return;
      try {
        const { error } = await supabase.from('profiles').delete().eq('id', userId);
        if (error) throw error;
        loadUsers();
      } catch (error) { alert('Error: ' + error.message); }
    }

    checkAuth();
  </script>
</body>
</html>
