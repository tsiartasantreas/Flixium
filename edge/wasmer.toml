# Wasmer package manifest — JS service worker (WinterCG fetch handler).
[package]
name = "iflixify"
version = "0.2.0"
description = "iFlixify IPTV edge app: landing page, download redirect, password reset, admin panel"
license = "Proprietary"

# The runtime is a JS module with a default export { fetch } handler.
[module]
name = "iflixify"
source = "src/index.js"
description = "iFlixify IPTV edge service worker"
entrypoint = "default"

# Map the source directory into the module's virtual filesystem.
[fs]
"/src" = "./src"
