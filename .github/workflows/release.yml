name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: app

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Write key.properties
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename and copy APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk iFlixify.apk
          cp iFlixify.apk ../iFlixify.apk

      - name: Warn if unsigned
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::APK is UNSIGNED."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: iFlixify.apk
