name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - name: Prepare APK
        working-directory: app
        run: cp build/app/outputs/flutter-apk/app-release.apk ../iFlixify.apk
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          name: "iFlixify IPTV ${{ steps.version.outputs.VERSION }}"
          body: |
            ## iFlixify IPTV ${{ steps.version.outputs.VERSION }}

            Netflix-style IPTV player for Android phone, Android TV, and Fire TV.

            ### Installation
            1. Download `iFlixify.apk` below
            2. Enable "Install from unknown sources" on your device
            3. Open the APK to install

            ### Changes
            See [full changelog](https://github.com/tsiartasantreas/iFlixify-IPTV/compare/${{ steps.version.outputs.VERSION }}...main) for details.
          generate_release_notes: true
          files: iFlixify.apk
