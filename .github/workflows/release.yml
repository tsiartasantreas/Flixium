name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: app

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode release keystore (if provided)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Write key.properties (if provided)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build APKs (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Rename split APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk iflixify-arm64.apk || true

      - name: Build universal (fat) APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk iflixify-universal.apk

      - name: Copy APKs to repo root for release action
        run: |
          cp iflixify-arm64.apk ../iflixify-arm64.apk
          cp iflixify-universal.apk ../iflixify-universal.apk

      - name: Warn if unsigned
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::APKs are UNSIGNED — set RELEASE_KEYSTORE_BASE64 + passwords to sign releases."

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            iflixify-arm64.apk
            iflixify-universal.apk
